plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.20.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.test {
    useJUnitPlatform()
    exclude "**/AntiXrayEnabledShadowIsolationTest.class"
    exclude "**/ShadowValidationEnabledRuntimeTest.class"
    exclude "**/ShadowValidationExplicitlyDisabledTest.class"
    exclude "**/ShadowValidationOnlyEnabledTest.class"
}

tasks.register("shadowEnabledTest", Test) {
    description = "Runs guarded runtime tests with startup shadow mode enabled."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/AntiXrayEnabledShadowIsolationTest.class"
    systemProperty "mundoz.antixray.v2-shadow", "true"
    shouldRunAfter tasks.test
}

tasks.register("shadowValidationEnabledTest", Test) {
    description = "Runs runtime tests with shadow validation enabled at startup."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/ShadowValidationEnabledRuntimeTest.class"
    systemProperty "mundoz.antixray.v2-shadow", "true"
    systemProperty "mundoz.antixray.v2-shadow-validation", "true"
    shouldRunAfter tasks.shadowEnabledTest
}

tasks.register("shadowValidationExplicitlyDisabledTest", Test) {
    description = "Runs validation activation tests with explicit startup false."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/ShadowValidationExplicitlyDisabledTest.class"
    systemProperty "mundoz.antixray.v2-shadow-validation", "false"
    shouldRunAfter tasks.shadowValidationEnabledTest
}

tasks.register("shadowValidationOnlyEnabledTest", Test) {
    description = "Proves validation activation does not activate shadow execution."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include "**/ShadowValidationOnlyEnabledTest.class"
    systemProperty "mundoz.antixray.v2-shadow-validation", "true"
    shouldRunAfter tasks.shadowValidationExplicitlyDisabledTest
}

tasks.check {
    dependsOn tasks.shadowEnabledTest
    dependsOn tasks.shadowValidationEnabledTest
    dependsOn tasks.shadowValidationExplicitlyDisabledTest
    dependsOn tasks.shadowValidationOnlyEnabledTest
}

version = project.mod_version
group = project.maven_group

def modVersion = version.toString()

processResources {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}
